version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seqr
      POSTGRES_USER: seqr
      POSTGRES_PASSWORD: seqr_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # NOTE: `build: .` uses audit/backend/Dockerfile, which does NOT install
  # shared-scanner. For a stack that actually runs scans on a worker, use
  # deploy/worker/docker-compose.yml (builds from repo root with the scanner).
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://seqr:seqr_dev@db:5432/seqr
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-not-for-production
      ENVIRONMENT: development
      # Real broker + dedicated worker below → don't run scans inline.
      USE_FAKE_REDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
    depends_on:
      - db
      - redis
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://seqr:seqr_dev@db:5432/seqr
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-not-for-production
      USE_FAKE_REDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
    depends_on:
      - db
      - redis

volumes:
  db_data:
