name: PQC Drift Trend

# Scheduled, whole-tree PQC drift report (the non-PR complement to pqc-scan.yml).
# Weekly: scan the whole tree against the crypto policy, record a dated snapshot, and
# report drift movement (new vs resolved) since the previous snapshot. Advisory by
# default — set a fail-budget to hold the line.

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC — a weekly summary
  workflow_dispatch: {}       # allow a manual run

permissions:
  contents: write             # commit the dated snapshot back to the repo

jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install seqr
        run: python -m pip install --quiet ./cli   # or: pip install seqr

      - name: Record snapshot + trend report
        id: trend
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pqc-trend.md"
          # Advisory here (no --fail-budget). Add e.g. `--fail-budget 0` to fail on any
          # new drift, or a positive N to allow a weekly allowance.
          seqr ci . --snapshot --comment-file "$report" || code=$?
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .seqr/snapshots || true
          if git diff --cached --quiet; then
            echo "no snapshot change to commit"
          else
            git commit -m "chore(pqc): weekly drift snapshot [skip ci]"
            git push
          fi
