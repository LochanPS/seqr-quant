name: "SeQr PQC Gate"
description: >-
  Scan a pull request for quantum-vulnerable cryptography introduced on changed lines
  and (optionally) fail the build. Wraps the `seqr ci` command. Exit 0 by default —
  set fail-on or policy to gate.
author: "SeQr Labs"

branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan."
    required: false
    default: "."
  base:
    description: >-
      Base git ref to diff against (e.g. the PR base branch). Leave empty to
      auto-detect (origin/main, main, then HEAD~1).
    required: false
    default: ""
  fail-on:
    description: "Fail the build on findings at this severity or above (low|medium|high|critical)."
    required: false
    default: ""
  policy:
    description: "Severity shorthand: strict (fail on high+) or lax (fail on critical only)."
    required: false
    default: ""
  policy-file:
    description: >-
      Path to a declarative crypto policy (spine {"rules":[...]} shape). Leave empty to
      auto-discover seqr-policy.json, else the built-in baseline (no quantum-vulnerable
      families) is used.
    required: false
    default: ""
  fail-on-drift:
    description: >-
      Fail the build on NEW findings that drift from the crypto policy (true|false).
      Independent of severity gating.
    required: false
    default: ""
  baseline:
    description: >-
      Path to a baseline of accepted findings (default: auto-discover seqr-baseline.json).
      Only findings absent from it can fail the gate.
    required: false
    default: ""
  config:
    description: "Path to seqr-ci.yml defaults (default: auto-discover)."
    required: false
    default: ""
  language:
    description: "Restrict to one language (python|javascript|java|go|all)."
    required: false
    default: ""
  install-spec:
    description: >-
      pip install target for the seqr CLI. Default installs from PyPI; pass a local
      path (e.g. ./cli) to use an in-repo build.
    required: false
    default: "seqr"
  api-url:
    description: >-
      SeQr audit backend base URL (e.g. https://api.seqrlabs.com/api/v1). Set together
      with api-key to push PR findings into the org's CBOM/dashboard. Leave empty to
      disable the push entirely (feature-flagged off).
    required: false
    default: ""
  api-key:
    description: >-
      SeQr API key (sq_live_...) for the dashboard push. Pass from a repo secret. The push
      is best-effort and never fails the build.
    required: false
    default: ""

outputs:
  comment-file:
    description: "Path to the generated Markdown report."
    value: ${{ steps.scan.outputs.comment-file }}
  sarif-file:
    description: "Path to the generated SARIF 2.1.0 file (for code-scanning upload)."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install seqr
      shell: bash
      run: python -m pip install --quiet "${{ inputs.install-spec }}"

    - name: Run PQC gate
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        comment_file="$RUNNER_TEMP/seqr-pqc-comment.md"
        sarif_file="$RUNNER_TEMP/seqr-pqc.sarif"
        json_file="$RUNNER_TEMP/seqr-pqc.json"
        args=("ci" "${{ inputs.path }}" "--comment-file" "$comment_file" "--sarif-file" "$sarif_file")
        [ -n "${{ inputs.base }}" ]        && args+=("--base" "${{ inputs.base }}")
        [ -n "${{ inputs.fail-on }}" ]     && args+=("--fail-on" "${{ inputs.fail-on }}")
        [ -n "${{ inputs.policy }}" ]      && args+=("--policy" "${{ inputs.policy }}")
        [ -n "${{ inputs.policy-file }}" ] && args+=("--policy-file" "${{ inputs.policy-file }}")
        [ -n "${{ inputs.baseline }}" ]    && args+=("--baseline" "${{ inputs.baseline }}")
        [ -n "${{ inputs.config }}" ]      && args+=("--config" "${{ inputs.config }}")
        [ -n "${{ inputs.language }}" ]    && args+=("--language" "${{ inputs.language }}")
        [ "${{ inputs.fail-on-drift }}" = "true" ]  && args+=("--fail-on-drift")
        [ "${{ inputs.fail-on-drift }}" = "false" ] && args+=("--no-fail-on-drift")

        echo "comment-file=$comment_file" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"

        # Run the gate; capture its exit code so we can still publish the summary + SARIF.
        set +e
        seqr "${args[@]}"
        code=$?
        set -e

        # A separate, non-gating JSON emission for the optional dashboard push, over the
        # same PR scope as the gate (same base/diff args, minus the gating flags).
        json_args=("ci" "${{ inputs.path }}" "--quiet" "--output" "json")
        [ -n "${{ inputs.base }}" ]     && json_args+=("--base" "${{ inputs.base }}")
        [ -n "${{ inputs.language }}" ] && json_args+=("--language" "${{ inputs.language }}")
        seqr "${json_args[@]}" > "$json_file" 2>/dev/null || true
        echo "json-file=$json_file" >> "$GITHUB_OUTPUT"

        if [ -f "$comment_file" ]; then
          cat "$comment_file" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $code

    - name: Upload SARIF to GitHub code scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: seqr-pqc

    - name: Push findings to SeQr dashboard (optional)
      if: always() && inputs.api-url != '' && inputs.api-key != ''
      shell: bash
      env:
        SEQR_API_URL: ${{ inputs.api-url }}
        SEQR_API_KEY: ${{ inputs.api-key }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        JSON_FILE: ${{ steps.scan.outputs.json-file }}
      run: |
        set -euo pipefail
        [ -f "$JSON_FILE" ] || { echo "no findings JSON to push"; exit 0; }
        # Build the request body with jq (avoids embedding a script in this YAML block).
        payload="$(jq -n \
          --arg repo "$REPO" \
          --arg commit "$COMMIT_SHA" \
          --arg branch "$BRANCH" \
          --arg source "github" \
          --argjson pr "${PR_NUMBER:-null}" \
          --slurpfile rep "$JSON_FILE" \
          '{repo:$repo, pr_number:$pr, commit_sha:$commit, branch:$branch, source:$source,
            summary:($rep[0].summary // {}), gate:($rep[0].gate // {}),
            findings:($rep[0].findings // [])}')"
        code=$(curl -sS -o "$RUNNER_TEMP/seqr_push_resp.json" -w "%{http_code}" \
          -X POST "$SEQR_API_URL/ci/findings" \
          -H "Authorization: Bearer $SEQR_API_KEY" \
          -H "Content-Type: application/json" \
          --data "$payload" || echo "000")
        echo "dashboard push HTTP $code"
        # Never fail the build on a push problem — the gate result is authoritative.
        if [ "$code" != "200" ] && [ "$code" != "201" ]; then
          echo "::warning:: SeQr dashboard push returned HTTP $code (non-fatal)"
          cat "$RUNNER_TEMP/seqr_push_resp.json" 2>/dev/null || true
        fi
