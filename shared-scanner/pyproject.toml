[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqr-scanner"
version = "0.1.0"
description = "Shared scanner package for SeQr — TLS, code, and cloud scanning engines"
license = {text = "Proprietary"}
authors = [{name = "Lochan", email = "lochan@seqr.in"}]
requires-python = ">=3.10"
dependencies = [
    "sslyze==6.3.1",
    "cryptography>=43,<47",  # sslyze 6.3.1 requires cryptography>=43,<47
]

[project.optional-dependencies]
code = [
    "tree-sitter==0.23.0",
    "tree-sitter-python==0.23.0",
    "tree-sitter-javascript==0.23.0",
    "tree-sitter-java==0.23.0",
    "tree-sitter-go==0.23.0",
    "GitPython==3.1.43",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*", "engines*", "seqr_scanner*"]

[tool.setuptools.package-data]
"scanner" = ["patterns/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: marks tests that require internet access (deselect with '-m not integration')",
]
