# SeQr — single-box PRODUCTION stack for AWS EC2 (ap-south-1 / Mumbai, Graviton t4g).
#
# One instance hosts the WHOLE product: Postgres (persistent EBS), Redis, the API,
# a real async scan worker (A6), the Next.js frontend, and Caddy for automatic HTTPS
# on both www.seqrlabs.com and api.seqrlabs.com. Data at rest lives in India
# (ap-south-1) → satisfies the CERT-In / DPDP residency rule. No managed RDS/
# ElastiCache/ALB/NAT — everything is on-box to stay inside the free-credit budget.
#
# Lives in deploy/aws/ but MUST run from the repo root so the backend/worker build
# context (repo root) sees shared-scanner/:
#   docker compose -f deploy/aws/docker-compose.prod.yml --env-file deploy/aws/.env up -d --build
#
# --env-file is REQUIRED: the ${DB_PASSWORD} / ${NEXT_PUBLIC_*} substitutions below
# read it (env_file: only injects into the container, not into compose interpolation).

services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: host pg_dump for nightly backups; SG never exposes 5432
    environment:
      POSTGRES_DB: seqr
      POSTGRES_USER: seqr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/aws/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seqr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../..                                 # repo root → shared-scanner/ in context
      dockerfile: audit/backend/Dockerfile.render     # trixie / OpenSSL 3.5 → active PQC probe
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./.env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://seqr:${DB_PASSWORD}@db:5432/seqr
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production                         # triggers validate_production(): real SECRET_KEY, no fakeredis/sqlite/localhost CORS
      DEPLOYMENT_MODE: saas                           # no on-prem license gate
      USE_FAKE_REDIS: "false"
      CELERY_ALWAYS_EAGER: "false"                    # real worker below runs scans
      MAX_CONCURRENT_SCANS_PER_ORG: ${MAX_CONCURRENT_SCANS_PER_ORG:-3}
    volumes:
      - reports:/app/backend/reports
    expose:
      - "8000"                                        # internal only; Caddy terminates TLS

  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started                    # backend runs `alembic upgrade head` on boot
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://seqr:${DB_PASSWORD}@db:5432/seqr
      REDIS_URL: redis://redis:6379/0
      USE_FAKE_REDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
      ENVIRONMENT: production
      DEPLOYMENT_MODE: saas
      MAX_CONCURRENT_SCANS_PER_ORG: ${MAX_CONCURRENT_SCANS_PER_ORG:-3}
      # t4g.medium = 2 vCPU / 4GB. Scans are TLS+subprocess heavy; keep the pool small.
      SCAN_WORKER_CONCURRENCY: ${SCAN_WORKER_CONCURRENCY:-2}
    volumes:
      - reports:/app/backend/reports

  frontend:
    build:
      context: ../../audit/frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time. Set these in deploy/aws/.env.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.seqrlabs.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.seqrlabs.com}
    restart: always
    environment:
      # Server-side /api proxying (rewrites) reaches the backend container directly.
      INTERNAL_API_URL: http://backend:8000
    expose:
      - "3000"                                        # internal only; Caddy terminates TLS

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  redis_data:
  reports:
  caddy_data:
  caddy_config:
